services:
  postgres:
    image: postgres:16
    container_name: inmobiliaria_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: realestate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage S3-compatible para la multimedia de las propiedades. Corre en el
  # mismo VPS; el día que se migre a S3 o R2 solo cambian las variables de
  # entorno del backend, no el código.
  minio:
    image: minio/minio:latest
    container_name: inmobiliaria_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: devminiopassword
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket y lo deja de lectura pública. Las fotos de las propiedades
  # se publican en catálogos abiertos: son públicas por diseño. La escritura
  # sigue exigiendo firma.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin devminiopassword &&
      mc mb --ignore-existing local/inmobiliaria-media &&
      mc anonymous set download local/inmobiliaria-media
      "

volumes:
  pgdata:
  miniodata:
