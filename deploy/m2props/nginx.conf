# ─────────────────────────────────────────────────────────────
# M2Props: la plataforma inmobiliaria, servida bajo un subpath de un dominio que
# ya tiene otro sitio en la raíz.
#
# Esto NO es un archivo de sites-available: es un include que va DENTRO del
# server block del apex (sites-available/hernandez-landing). No puede ser un
# server block propio con el mismo server_name, porque nginx se queda con el
# primero que encuentra y el resto queda como warning.
#
#   include /etc/nginx/snippets/m2props.conf;   ← una línea, en el server 443
#
# Las fotos de la web de la inmobiliaria (hernandez-landing) no se ven afectadas:
# viven en /assets/ y /, que no matchean con ningún location de acá.
# ─────────────────────────────────────────────────────────────

# Los upstreams viven en nginx-upstreams.conf (→ conf.d), no acá: `upstream` solo
# es válido en el contexto http, y este archivo se incluye dentro de un server.

# ── La URL vieja ─────────────────────────────────────────────
# La app se publicó primero como /m2props y el 2026-10-09 pasó a /m2prop. Los
# enlaces viejos (compartidos, indexados, guardados) se mandan a la ruta nueva
# conservando el resto del camino y la query. 308 y no 301: es igual de
# permanente para el buscador, pero un POST a la API vieja (un bundle viejo
# abierto en una pestaña) sigue siendo POST en vez de degradarse a GET.
#
# Se lee de $request_uri porque trae la query pegada; el `if` con solo un
# `return` adentro es el uso seguro de `if` en nginx.
location = /m2props {
    return 308 /m2prop/;
}
location ^~ /m2props/ {
    if ($request_uri ~ ^/m2props/(.*)$) {
        return 308 /m2prop/$1;
    }
    return 308 /m2prop/;
}

# ── Redirección y directorios exactos ────────────────────────
# Sin la barra final, `base` y las rutas del router no matchean: /m2prop y
# /m2prop/propiedad/abc son caminhos distintos para el navegador.
location = /m2prop {
    return 301 /m2prop/;
}

# La home de la SPA. Se resuelve a index.html a mano en vez de confiar en
# `index index.html`: el index interno redirigiría a /index.html, que no
# matchea con ningún location de acá y caería en el sitio estático de la raíz.
location = /m2prop/ {
    rewrite ^ /index.html break;
    root /var/www/m2props;
    include /etc/nginx/snippets/m2props-headers.conf;
}

# Lo mismo para cuando el fallback de try_files devuelve el index. Sin este
# bloque, el index.html se cachearía con el mismo TTL que los assets con hash.
location = /m2prop/index.html {
    rewrite ^ /index.html break;
    root /var/www/m2props;
    include /etc/nginx/snippets/m2props-headers.conf;
}

# ── Assets con hash en el nombre ─────────────────────────────
# ^~ porque los nombres llevan hash: si el contenido cambia, cambia el nombre, y
# se pueden cachear para siempre. Es la razón de que el index.html de arriba
# lleve su propio bloque sin caché.
location ^~ /m2prop/assets/ {
    rewrite ^/m2prop/assets/(.*)$ /assets/$1 break;
    root /var/www/m2props;
    expires 30d;
    include /etc/nginx/snippets/m2props-headers.conf;
}

# ── API ──────────────────────────────────────────────────────
# El proxy_pass CON URI final reescribe: lo que matchea (/m2prop/api/) se
# reemplaza por /api/. El backend monta todo bajo /api, así que el prefijo solo
# se quita, no se agrega.
#
# ^~ para que ninguna location con regex que se agregue después se coma estas
# rutas.
location ^~ /m2prop/api/ {
    proxy_pass http://m2props_backend/api/;

    # Host público, no el del upstream: el sitemap y las URL absolutas del SEO
    # los arma el backend con el Host del pedido.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # El backend confía en el primer proxy (app.ts) para el rate limit, así que
    # esto no es opcional: sin X-Forwarded-For todas las peticiones del mundo
    # cuentan como una sola IP y el rate limit deja de tener sentido.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # express.json limita a 1mb; el margen es para no cortar antes que él.
    client_max_body_size 2m;
}

# ── Multimedia (MinIO) ───────────────────────────────────────
# Va en la RAÍZ del host y no bajo /m2prop, y no es una inconsistencia: es la
# única forma de que funcione.
#
# S3 con direccionamiento por path (forcePathStyle, que es lo que necesita
# cualquier S3-compatible) arma la URL como /<bucket>/<key>. MinIO interpreta el
# PRIMER segmento de la ruta como el bucket, así que si el prefijo del endpoint
# fuera /m2prop, la ruta firmada quedaría /m2prop/inmobiliaria-media/<key> y
# MinIO buscaría un bucket llamado "m2prop". No hay forma de reescribirlo en el
# proxy: la reescritura cambiaría la ruta que MinIO calcula para validar la firma
# y todo PUT caería en SignatureDoesNotMatch. Verificado contra el despliegue.
#
# La alternativa sería darle a MinIO su propio hostname (media.TU-DOMINIO, que es
# lo que hace el compose con cdn), con su A y su certificado. Acá no está
# justificable: el comodín *.hernandezyasociados.com.ar ya resuelve a este VPS,
# pero el certificado que lo cubre no es un comodín, y agregar un nombre y un
# certificado a un dominio de otro cliente es más superficie que un prefijo de
# ruta que no colisiona con nada (/ y /assets/ son del sitio estático).
#
# OJO: el path NO se reescribe y el Host tampoco se toca. Las URLs de subida van
# firmadas con SigV4, que firma el host y la ruta completa: si nginx cambiara
# cualquiera de los dos, MinIO calcularía otra firma y todo PUT fallaría con
# SignatureDoesNotMatch. Por eso S3_ENDPOINT del backend tiene que ser el origen
# público pelado, sin el prefijo.
location ^~ /inmobiliaria-media/ {
    proxy_pass http://m2props_minio;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 500m, que es el tope por archivo que pone el backend (MAX_SIZE_BYTES del
    # módulo de media). Con menos, los videos de más de X MB fallarían con un
    # 413 de nginx que no explica nada: el usuario vería que la foto "no se
    # subió" sin ninguna pista del motivo. Acá nginx es el único freno real,
    # porque una URL firmada no pone techo al tamaño.
    client_max_body_size 500m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ── SEO ──────────────────────────────────────────────────────
# sitemap.xml y robots.txt cuelgan de la raíz del backend, no de /api, así que
# acá se reescriben a mano. Viven bajo /m2prop y no en la raíz del dominio: la
# raíz ya tiene su propio robots.txt, del sitio estático, y pisarlo le
# borraría el archivo a otro sitio.
location = /m2prop/sitemap.xml {
    proxy_pass http://m2props_backend/sitemap.xml;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /m2prop/robots.txt {
    proxy_pass http://m2props_backend/robots.txt;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── La SPA ───────────────────────────────────────────────────
# Va último: se queda con todo lo que no matcheó arriba (las rutas del router).
location /m2prop/ {
    # El prefijo no existe en el disco, así que se quita antes de buscar el
    # archivo. `break` deja la reescritura acá en vez de volver a buscar otro
    # location, que es lo que permite que el root de abajo gane.
    rewrite ^/m2prop/(.*)$ /$1 break;
    root /var/www/m2props;

    # El fallback CONSERVA el prefijo a propósito. Si devolviera /index.html, la
    # redirección interna caería en el location / del sitio estático y una
    # URL profunda de la SPA devolvería la landing del cliente.
    try_files $uri $uri/ /m2prop/index.html;

    include /etc/nginx/snippets/m2props-headers.conf;
}
