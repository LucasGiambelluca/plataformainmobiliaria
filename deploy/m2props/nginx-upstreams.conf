# Upstreams de M2Props.
#
# Van en conf.d y NO en el snippet que se incluye dentro del server block del
# apex: `upstream` solo es válido en el contexto http, y un include dentro de un
# server no lo es. nginx -t lo dice claro ("upstream directive is not allowed
# here"), pero conviene tenerlo separado desde el arranque.
#
# Loopback y nada más: estos puertos no se publican y ufw además tiene DROP por
# defecto. Las dos barreras son a propósito.

upstream m2props_backend {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream m2props_minio {
    server 127.0.0.1:9000;
    keepalive 8;
}
