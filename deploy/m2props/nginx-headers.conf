# Cabeceras de seguridad de M2Props.
#
# Van en un snippet aparte y se incluye en cada location con `add_header` propio
# porque nginx NO hereda `add_header` del bloque padre cuando el hijo define uno:
# el hijo reemplaza al del padre en silencio. El de /m2props/assets/ mete su
# `expires`, y sin este include los sitios sin `add_header` propio se quedarían
# sin una sola cabecera.
#
# HSTS aparece acá, no en el server block del apex, para no cambiar el
# comportamiento del sitio estático del cliente. Tiene un efecto de host, no de
# ruta: una vez que el navegador lo recibe, lo aplica a todo el dominio. Es
# seguro porque el apex ya fuerza https con un 301 y los dos nombres (apex y
# www) tienen certificado válido.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
